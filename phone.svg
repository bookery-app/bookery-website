<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 727 1500" preserveAspectRatio="none">
  <!-- iPhone 18 Pro, von vorn, Maße in 0,1 mm (71,9 × 150 mm laut Apple). Der Bildschirm bleibt frei, darunter liegt der Screenshot. -->
  <defs>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#5d6167"/><stop offset=".012" stop-color="#c3c7cc"/><stop offset=".03" stop-color="#7d8187"/>
      <stop offset=".5" stop-color="#6a6e74"/><stop offset=".97" stop-color="#7d8187"/><stop offset=".988" stop-color="#c3c7cc"/><stop offset="1" stop-color="#5d6167"/>
    </linearGradient>
    <linearGradient id="taste" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9a9ea4"/><stop offset=".5" stop-color="#5f6369"/><stop offset="1" stop-color="#8d9197"/>
    </linearGradient>
    <mask id="glas">
      <rect width="727" height="1500" fill="#fff"/>
      <rect x="30.5" y="26" width="666" height="1448" rx="102.5" fill="#000"/>
    </mask>
  </defs>
  <!-- Tasten: links Action-Button und Lautstärke, rechts Seitentaste und Camera Control -->
  <g fill="url(#taste)">
    <rect x="0" y="282" width="8" height="58" rx="3"/>
    <rect x="0" y="400" width="8" height="96" rx="3"/>
    <rect x="0" y="526" width="8" height="96" rx="3"/>
    <rect x="719" y="430" width="8" height="150" rx="3"/>
    <rect x="720" y="838" width="7" height="104" rx="3"/>
  </g>
  <g mask="url(#glas)">
    <!-- Rahmen aus Metall -->
    <rect x="4" y="0" width="719" height="1500" rx="129" fill="url(#metal)"/>
    <rect x="4.75" y=".75" width="717.5" height="1498.5" rx="128.3" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
    <!-- schwarzer Rand ums Glas -->
    <rect x="15" y="11" width="697" height="1478" rx="118" fill="#030304"/>
    <rect x="15" y="11" width="697" height="1478" rx="118" fill="none" stroke="#000" stroke-width="2"/>
  </g>
  <!-- Dynamic Island -->
  <rect x="259.5" y="44" width="208" height="61" rx="30.5" fill="#000"/>
</svg>
